# Deploy on merge to main - agentx-data
#
# Runs on the ugbrutal self-hosted Windows runner and delegates to the
# ecosystem deploy script. The script fast-forwards all repos and refreshes
# Docker services through AGENTX_PROD=1 ./agentx rebuild <service>.

name: deploy-on-main

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, ugbrutal, deploy]
    timeout-minutes: 20
    steps:
      - name: Run deploy script
        shell: pwsh
        run: |
          $root = $env:AGENTX_ECOSYSTEM_ROOT
          if (-not $root) {
            $root = 'C:\Users\Yanik\OneDrive\Documents\New project'
          }
          $script = Join-Path $root 'scripts\deploy-main.sh'
          $bashScript = bash -lc "wslpath -a '$script'"
          bash $bashScript --restart-service data
